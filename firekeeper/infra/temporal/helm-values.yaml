cassandra:
  enabled: false
elasticsearch:
  enabled: false
grafana:
  enabled: true
  rbac:
    create: true
    namespaced: true
  service:
    annotations:
      tailscale.com/expose: "true"
      tailscale.com/hostname: firekeeper-temporal-grafana
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: temporal
  dashboards:
    default:
      misc-clustermonitoring-kubernetes-github:
        url: ""
mysql:
  enabled: false
postgresql:
  enabled: false
prometheus:
  enabled: true
web:
  enabled: true
  service:
    port: 80
    annotations:
      tailscale.com/expose: "true"
      tailscale.com/hostname: firekeeper-temporal-ui
  additionalEnv:
    - name: TEMPORAL_CSRF_COOKIE_INSECURE
      value: "true"
schema:
  createDatabase:
    enabled: false
  setup:
    enabled: true
  update:
    enabled: true
server:
  config:
    persistence:
      default:
        driver: sql
        sql:
          database: postgres
          driver: postgres12
          existingSecret: temporal-default-store
          host: us-west-2.pg.psdb.cloud
          maxConnLifetime: 1h
          maxConns: 5
          maxIdleConns: 5
          # IMPORTANT: Must use port 5432 (direct), NOT 6432 (PgBouncer).
          # Temporal uses prepared statements which PgBouncer doesn't support.
          port: 5432
          user: postgres.gareegatjolh
          tls:
            enabled: true
            enableHostVerification: true
            serverName: us-west-2.pg.psdb.cloud
      visibility:
        driver: sql
        sql:
          database: postgres
          driver: postgres12
          existingSecret: temporal-visibility-store
          host: us-west-2.pg.psdb.cloud
          maxConnLifetime: 1h
          maxConns: 5
          maxIdleConns: 5
          # Must use direct connection (5432), not PgBouncer (6432)
          port: 5432
          user: postgres.gareegatjolh
          tls:
            enabled: true
            enableHostVerification: true
            serverName: us-west-2.pg.psdb.cloud
