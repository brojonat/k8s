apiVersion: v1
kind: Service
metadata:
  name: deadman-worker-metrics
  labels:
    app: deadman
    component: workers
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: deadman
    component: workers
  ports:
  - name: metrics
    port: 9000
    targetPort: 9000
    protocol: TCP
  type: ClusterIP
