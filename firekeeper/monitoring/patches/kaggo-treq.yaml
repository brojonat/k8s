# Patch for kaggo-treq-worker deployment to enable Prometheus scraping
# Apply with: kubectl patch deployment kaggo-treq-worker -n default --patch-file k8s/patches/kaggo-treq.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaggo-treq-worker
spec:
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: kaggo-treq-worker
        ports:
        - name: metrics
          containerPort: 9000
          protocol: TCP
