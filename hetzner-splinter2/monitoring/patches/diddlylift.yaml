# Patch for diddlylift-workers deployment to enable Prometheus scraping
# Apply with: kubectl patch deployment diddlylift-workers -n default --patch-file k8s/patches/diddlylift.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: diddlylift-workers
spec:
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: diddlylift-workers
        ports:
        - name: metrics
          containerPort: 9000
          protocol: TCP
