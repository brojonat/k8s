# Patch for gip-worker deployment to enable Prometheus scraping
# Apply with: kubectl patch deployment gip-worker -n default --patch-file k8s/patches/gip.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gip-worker
spec:
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: gip-worker
        ports:
        - name: metrics
          containerPort: 9000
          protocol: TCP
